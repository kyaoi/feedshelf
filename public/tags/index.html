<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FeedShelf / Tags</title>
    <meta
      name="description"
      content="FeedShelf のタグ一覧ページ。public/data/tags.json と articles.json を読み込み、指定タグの記事一覧を表示します。"
    />
    <link rel="stylesheet" href="../assets/styles.css" />
    <script defer src="../assets/app.js"></script>
  </head>
  <body>
    <header class="hero hero--compact">
      <div class="container">
        <div class="hero-card">
          <div class="hero__main">
            <a class="back-link" href="../">← トップへ戻る</a>
            <p class="eyebrow">FeedShelf / Tags</p>
            <h1 id="tag-page-title">タグを選択してください</h1>
            <p id="tag-page-description" class="lead">
              トップページまたはタグ一覧から対象タグを選ぶと、該当記事だけを表示します。
            </p>
          </div>
          <aside class="hero__aside">
            <div class="hero-surface">
              <p class="panel__eyebrow">Navigate</p>
              <h2>別の探索導線へ</h2>
              <div class="hero-badge-list">
                <a class="hero-badge" href="../">棚カタログへ</a>
                <a class="hero-badge" href="../search/">検索ページへ</a>
                <a class="hero-badge" href="../sources/">媒体一覧へ</a>
              </div>
            </div>
          </aside>
        </div>
      </div>
    </header>

    <main class="container layout">
      <section class="panel" aria-labelledby="tag-nav-title">
        <div class="panel__heading">
          <div>
            <p class="panel__eyebrow">タグ</p>
            <h2 id="tag-nav-title">タグ一覧</h2>
          </div>
          <p id="generated-at" class="muted">読み込み中…</p>
        </div>
        <div id="tag-nav" class="chip-list" aria-live="polite">
          <p class="placeholder-text">読み込み中…</p>
        </div>
      </section>

      <section class="panel" aria-labelledby="articles-title">
        <div class="panel__heading">
          <div>
            <p class="panel__eyebrow">記事</p>
            <h2 id="articles-title">タグ別の記事一覧</h2>
          </div>
          <p id="articles-count" class="muted">読み込み中…</p>
        </div>

        <div id="articles-status" class="status status--loading" aria-live="polite">
          公開 JSON を読み込んでいます…
        </div>
        <ol id="articles-list" class="article-list" hidden></ol>
      </section>
    </main>
  </body>
</html>
