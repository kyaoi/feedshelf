<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FeedShelf / Search</title>
    <meta
      name="description"
      content="FeedShelf の横断検索ページ。public/data/search-index.json と articles.json を読み込み、タイトル・媒体名・タグ名から記事を探します。"
    />
    <link rel="stylesheet" href="../assets/styles.css" />
    <script defer src="../assets/app.js"></script>
  </head>
  <body>
    <header class="hero hero--compact">
      <div class="container">
        <div class="hero-card">
          <div class="hero__main">
            <a class="back-link" href="../">← トップへ戻る</a>
            <p class="eyebrow">FeedShelf / Search</p>
            <h1 id="search-page-title">横断検索で探す</h1>
            <p id="search-page-description" class="lead">
              タイトル・媒体名・タグ名から記事を探せる補助 discovery 導線です。
            </p>
          </div>
          <aside class="hero__aside">
            <div class="hero-surface">
              <p class="panel__eyebrow">Navigate</p>
              <h2>他の入口も使う</h2>
              <div class="hero-badge-list">
                <a class="hero-badge" href="../">棚カタログへ戻る</a>
                <a class="hero-badge" href="../tags/">タグ一覧へ</a>
                <a class="hero-badge" href="../sources/">媒体一覧へ</a>
              </div>
            </div>
          </aside>
        </div>
      </div>
    </header>

    <main class="container layout">
      <section class="panel" aria-labelledby="search-form-title">
        <div class="panel__heading">
          <div>
            <p class="panel__eyebrow">Search</p>
            <h2 id="search-form-title">検索語を入力</h2>
          </div>
          <p id="generated-at" class="muted">読み込み中…</p>
        </div>
        <form class="search-form" action="./" method="get">
          <label class="search-form__label" for="search-query-input">タイトル・媒体名・タグ名</label>
          <div class="search-form__controls">
            <input
              id="search-query-input"
              class="search-form__input"
              type="search"
              name="q"
              placeholder="例: kubernetes publickey cloud"
              autocomplete="off"
            />
            <button class="search-form__button" type="submit">検索</button>
          </div>
        </form>
        <div class="chip-list helper-links">
          <a class="chip chip--muted" href="../">棚カタログへ戻る</a>
          <a class="chip chip--muted" href="../tags/">タグ一覧へ</a>
          <a class="chip chip--muted" href="../sources/">媒体一覧へ</a>
        </div>
      </section>

      <section class="panel" aria-labelledby="articles-title">
        <div class="panel__heading">
          <div>
            <p class="panel__eyebrow">Results</p>
            <h2 id="articles-title">検索結果</h2>
          </div>
          <p id="articles-count" class="muted">読み込み中…</p>
        </div>

        <div id="articles-status" class="status status--loading" aria-live="polite">
          検索 index を読み込んでいます…
        </div>
        <ol id="articles-list" class="article-list" hidden></ol>
      </section>
    </main>
  </body>
</html>
